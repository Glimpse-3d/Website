<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail Generator</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body {
      background-color: #FAFAFA;
      background-image: linear-gradient(to top, rgba(0,0,0,0.12), rgba(0,0,0,0));
    }

    /* Container quadrado: todos os thumbnails saem com a mesma proporção */
    #viewer-wrap {
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    #snap-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: #FAFAFA;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    #snap-btn:hover { background: #f5f5f5; }
    #snap-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

  <div id="viewer-wrap"></div>
  <button id="snap-btn" disabled>📷 a carregar…</button>

  <script>
    // ── MUDA AQUI O MODELO (ou usa ?model=15 no URL) ───────────────────────────
    const MODEL = new URLSearchParams(location.search).get('model') || 15;

    // ── CÂMARA INICIAL (igual para todos os thumbnails) ────────────────────────
    const CAMERA_ORBIT  = '0deg 80deg 200%';
    const FIELD_OF_VIEW = '9deg';
    // ───────────────────────────────────────────────────────────────────────────

    const mv = document.createElement('model-viewer');
    mv.setAttribute('src',               `model${MODEL}/model${MODEL}.gltf`);
    mv.setAttribute('environment-image', `model${MODEL}/model${MODEL}.hdr`);
    mv.setAttribute('camera-orbit',      CAMERA_ORBIT);
    mv.setAttribute('field-of-view',     FIELD_OF_VIEW);
    mv.setAttribute('shadow-intensity',  '1.5');
    mv.setAttribute('shadow-softness',   '1');
    mv.setAttribute('exposure',          '1');
    mv.setAttribute('interaction-prompt','none');
    // sem camera-controls e sem auto-rotate: a vista fica sempre igual
    document.getElementById('viewer-wrap').appendChild(mv);

    const snapBtn = document.getElementById('snap-btn');

    mv.addEventListener('load', () => {
      snapBtn.disabled = false;
      snapBtn.textContent = '📷 screenshot';
    });

    snapBtn.addEventListener('click', async () => {
      mv.jumpCameraToGoal();
      await new Promise(r => setTimeout(r, 120));
      const blob = await mv.toBlob({ idealAspect: false });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'thumbnail.png';
      a.click();
    });

    // ── Tecla T: voltar ao index.html ──
    document.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T') window.location.href = '../index.html';
    });
  </script>
</body>
</html>
