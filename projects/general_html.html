<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLIMPSE</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Glimpse">
    <link rel="manifest" href="/favicon/site.webmanifest">


    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="general_css.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- LOADER -->
  <script>
    // Mostra loader o mais cedo possível
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';
    });

    // Quando tudo estiver carregado (no fim do modelo)
    window.addEventListener("load", () => {
      const loader = document.getElementById('loader');
      const modelViewer = document.getElementById('model-viewer');
      if (modelViewer) {
        modelViewer.addEventListener('load', () => {
          setTimeout(() => {
            loader.classList.add('hidden');
            document.body.classList.add('loaded');
            modelViewer.classList.add('visible');
          }, 300);
        });
      } else {
        // Caso o model-viewer falhe (fallback)
        setTimeout(() => loader.classList.add('hidden'), 1000);
      }
    });
  </script>
</head>



<body>
  <!-- LOADER -->
<div id="loader">
  <div class="loader-logo">
    <img src="../../mainpage/LOGO.png" alt="Loading..." />
  </div>
</div>


<div class="background-overlay"></div>
  <h1 class="title" id="model-title"></h1>

  <a href="../../index.html" class="back-button">
      <img id="back-logo" src="../../mainpage/LOGO.png" alt="Back" style="width: 70px; height: auto;" />
</a>


<model-viewer
  id="model-viewer" 
  vr
  ar
  autoplay
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  shadow-intensity="1.5"
  shadow-softness="1">

  <!-- Dots -->
  <button slot="dot-height-top" class="dot" data-action="dimension-dot"></button>
  <button slot="dot-height-bottom" class="dot" data-action="dimension-dot"></button>
  <button slot="dot-width-1" class="dot" data-action="dimension-dot"></button>
  <button slot="dot-width-2" class="dot" data-action="dimension-dot"></button>
  <button slot="dot-depth-1" class="dot" data-action="dimension-dot"></button>
  <button slot="dot-depth-2" class="dot" data-action="dimension-dot"></button>

  <!-- Labels -->
  <button slot="label-height" class="dim" data-action="dimension-label" data-dimension="y"></button>
  <button slot="label-width" class="dim" data-action="dimension-label" data-dimension="x"></button>
  <button slot="label-depth" class="dim" data-action="dimension-label" data-dimension="z"></button>

  <!-- Linhas SVG -->
  <svg id="dimLines" class="dimensionLineContainer" width="100%" height="100%">
    <line class="dimensionLine"></line>
    <line class="dimensionLine"></line>
    <line class="dimensionLine"></line>
  </svg>

  <!-- Toggle Hotspot -->
  <button slot="hotspot-toggle-dims" class="hotspot" data-action="ToggleDimensions"></button>

  <button slot="ar-button" class="ar-button" id="ar-trigger">
      <img src="./augmented_reality_logo.png">
  </button>

  <!-- Button to generate QR code, fora do model-viewer -->
  <div id="ar-qr-code" class="ar-qr-button" onclick="generateQRCode(this)" data-media-type="image">
    <img id="ar-logo" src="./augmented_reality_logo.png" alt="AR QR Code">
  </div>

</model-viewer>


<!-- Mensagem de Destaque ao Iniciar -->
<div id="qr-intro-overlay">
<div id="qr-blur-background" class="qr-intro-blur"></div>
  <div class="qr-intro-message">See it come to life with Augmented Reality</div>
</div>


<div id="qr-code-container">
  <div class="qr-preview-content">

    <!-- Coluna esquerda: local para imagem/vídeo -->
    <div class="qr-column left" id="ar-preview-container">
    </div>
    <!-- Coluna direita: QR code e instruções fixas -->
    <div class="qr-column right">
      <p class="intro">Look how easy it is...</p>
      <div class="instructions">
        <p class="instruction">Open your smartphone’s camera app</p>
        <p class="instruction">Point it at the QR code</p>
        <p class="instruction">And try it in your place</p>
      </div>
      <div id="qr-code"></div>
    </div>
  </div>
</div>



<!-- MORE INFO -->
<button class="wrap" id="toggle-hotspots-button">
  <div class="border-button">
    <div class="arrow-text-wrapper">
      <div class="arrow-text">Find out more</div>
    </div>
    
    <!-- NEW HITBOX WRAPPER ADDED HERE -->
    <div class="arrow-hitbox">
      <div class="arrow">
        <span></span>
        <span></span>
      </div>
    </div>
    
  </div>
</button>


<!-- DESCRIÇÃO DO PROJECTO -->
<div class="bottom-left">
<div class="bottom-left-container">
    <div class="info-line">  <h1 id="project-name">Loading...</h1>
    <div class="details-right"> <p class="designer" id="project-designer"></p>
        <p class="location" id="project-location"></p>
    </div>
    </div>
    <p class="project-description" id="project-description"></p>
</div>
</div>


<!-- IMAGENS GALERIA-->
<div class="gallery">
  <div class="gallery-items"></div>
</div>


<!-- MODAL PARA AUMENTAR IMAGENS/VIDEOS -->
<div class="modal" style="display: none;">
  <div class="modal-container">
    <img class="modal-media" id="img01" style="display: none;">
    <video class="modal-media" id="video01" autoplay muted playsinline style="display: none;">
      <source id="videoSource" src="" type="video/mp4">
      Your browser does not support videos.
    </video>
  </div>
  <div id="modal-caption"></div>
</div>


<!-- ALTERAR TEXTURAS -->
<div id="material-change-container">
    <p id="material-name"></p>
    <div class="texture-group">
        <!-- texture buttons go here -->
    </div>
</div>

<script src="./general_js.js"></script>
</body>
</html>
